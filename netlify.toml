# ------------------------------------------------------------------
# Patro Notre-Dame d'Ittre — configuration Netlify
# ------------------------------------------------------------------
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Site statique + Netlify Functions — rien a builder'"

# IMPORTANT :
# La fonction netlify/functions/api.mjs declare elle-meme sa route
# via  export const config = { path: "/api/*" };
# => AUCUN [[redirects]] ne doit etre defini vers /.netlify/functions/api,
#    sinon cela cree un conflit de routage qui provoque des erreurs 404.

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
