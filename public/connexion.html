<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — Patro Notre-Dame d'Ittre</title><link rel="stylesheet" href="assets/style.css"></head>
<body>
<header class="hero hero-sm"><h1>🔑 Connexion</h1><p>Choisissez votre type de compte pour accéder à votre espace</p></header>
<main class="container-sm">

  <div id="etapeChoix">
    <div class="choix-role">
      <button type="button" onclick="choisirType('parent')">
        <span class="emoji-big">👨‍👩‍👧</span>
        <h3>Parent</h3>
        <p>Enfants, calendriers, documents, paiements, messages et notifications</p>
      </button>
      <button type="button" onclick="choisirType('animateur')">
        <span class="emoji-big">🧑‍🏫</span>
        <h3>Animateur</h3>
        <p>Espace animateur : calendrier, présences et questions de votre section</p>
      </button>
    </div>
  </div>

  <div id="etapeFormulaire" style="display:none">
    <section class="card card-accent">
      <p class="fil-ariane"><a href="#" onclick="retourChoix();return false">← Changer de type de compte</a></p>
      <h2 id="titreForm"></h2>
      <label>Adresse e-mail</label><input type="email" id="email" autocomplete="email">
      <label>Mot de passe</label><input type="password" id="password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')connecter()">
      <div class="btn-row"><button class="btn btn-primary" onclick="connecter()">Se connecter</button></div>
      <div id="msg"></div>
    </section>
    <p style="text-align:center">Pas encore de compte ? <a href="inscription.html">Créer une demande d'inscription</a></p>
  </div>
</main>
<script src="assets/app.js"></script>
<script>
renderHeader('');
renderFooter();
let TYPE_CHOISI = 'parent';

function choisirType(type){
  TYPE_CHOISI = type;
  document.getElementById('etapeChoix').style.display='none';
  document.getElementById('etapeFormulaire').style.display='block';
  document.getElementById('titreForm').textContent = type==='parent' ? '👨‍👩‍👧 Connexion — Espace parent' : '🧑‍🏫 Connexion — Espace animateur';
  document.getElementById('email').focus();
}
function retourChoix(){
  document.getElementById('etapeChoix').style.display='block';
  document.getElementById('etapeFormulaire').style.display='none';
  document.getElementById('msg').innerHTML='';
}

async function connecter(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if(!email||!password) return toast('E-mail et mot de passe requis',true);
  try{
    const r = await api('auth/login',{method:'POST',body:{email,password}});
    if(r.compte.role !== 'admin' && r.compte.role !== TYPE_CHOISI){
      document.getElementById('msg').innerHTML = `<div class="alert alert-err">Ce compte n'est pas un compte ${TYPE_CHOISI==='parent'?'parent':'animateur'}. Merci de choisir le bon type de compte.</div>`;
      return;
    }
    session.token = r.token; session.compte = r.compte; session.label = r.label;
    toast('Connexion réussie ✔');
    location.href = r.compte.role==='admin' ? 'admin.html' : r.compte.role==='animateur' ? 'animateur.html' : 'mes-enfants.html';
  }catch(e){
    document.getElementById('msg').innerHTML = `<div class="alert alert-err">${esc(e.message)}</div>`;
  }
}
</script>
</body></html>
