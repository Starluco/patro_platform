<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Histoire — Patro Notre-Dame d'Ittre</title><link rel="stylesheet" href="assets/style.css"></head>
<body>
<header class="hero hero-sm"><h1>📜 Notre histoire</h1><p>Les grandes dates du Patro Notre-Dame d'Ittre</p></header>
<main class="container-sm">
  <p class="fil-ariane"><a href="index.html">🏠 Accueil</a> / Histoire</p>
  <p class="page-sub">Cliquez sur le titre d'un événement pour en savoir plus.</p>
  <div class="timeline" id="timeline"><div class="loader"></div></div>
</main>
<script src="assets/app.js"></script>
<script>
(async function(){
  await renderHeader(''); renderFooter();
  try{
    const { contenu } = await api('contenu');
    const list = [...(contenu.histoire||[])].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    document.getElementById('timeline').innerHTML = list.length ? list.map(h=>`
      <div class="timeline-item">
        <div class="timeline-date">${esc(h.date)}</div>
        <h3 class="timeline-titre"><a href="histoire-detail.html?id=${encodeURIComponent(h.id)}">${esc(h.titre)}</a></h3>
        <p style="color:var(--gris);margin:0">${esc(h.texteCourt||'')}</p>
      </div>`).join('') : '<div class="empty">Aucun événement historique pour le moment.</div>';
  }catch(e){ document.getElementById('timeline').innerHTML = '<div class="alert alert-err">Impossible de charger l\'histoire.</div>'; }
})();
</script>
</body></html>
