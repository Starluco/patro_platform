<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon profil — Patro Notre-Dame d'Ittre</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="container">
  <h1 class="page-title"><span class="ico">👤</span> Mon profil</h1>
  <div class="card card-accent" id="carteProfil" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div class="loader"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="notifications">🔔 Notifications</button>
    <button class="tab" data-tab="paiements">💳 Paiements</button>
    <button class="tab" data-tab="documents">📄 Documents</button>
    <button class="tab" data-tab="compte">⚙️ Mon compte</button>
  </div>

  <div class="tab-panel active" id="panel-notifications">
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0">Mes notifications</h3>
        <button class="btn btn-ghost btn-sm" onclick="toutMarquerLu()">Tout marquer comme lu</button>
      </div>
      <div id="notifs" style="margin-top:14px"></div>
    </section>
  </div>

  <div class="tab-panel" id="panel-paiements">
    <div id="paiements"><div class="loader"></div></div>
  </div>

  <div class="tab-panel" id="panel-documents">
    <p class="page-sub">Retrouvez et modifiez les documents administratifs de chacun de vos enfants.</p>
    <div id="docsEnfants" class="grid grid-2"></div>
  </div>

  <div class="tab-panel" id="panel-compte">
    <section class="card">
      <h3>✏️ Mes coordonnées</h3>
      <div class="row"><div><label>Prénom</label><input id="cPrenom"></div><div><label>Nom</label><input id="cNom"></div></div>
      <div class="row"><div><label>Téléphone</label><input id="cTel"></div><div><label>Contact d'urgence</label><input id="cUrgence"></div></div>
      <label>Adresse</label><input id="cAdresse">
      <div class="row"><div><label>Code postal</label><input id="cCP"></div><div><label>Localité</label><input id="cLocalite"></div></div>
      <div class="btn-row"><button class="btn btn-primary" onclick="sauverCompte()">💾 Mettre à jour</button></div>
    </section>
    <div class="btn-row"><button class="btn btn-ghost" onclick="deconnexion()">🚪 Se déconnecter</button></div>
  </div>
</main>
<script src="assets/app.js"></script>
<script>
let COMPTE=null, ENFANTS=[];
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); document.getElementById('panel-'+t.dataset.tab).classList.add('active');
  history.replaceState(null,'','#'+t.dataset.tab);
});

(async function(){
  const me = await requireAuth(); if(!me) return;
  await renderHeader(''); renderFooter();
  COMPTE = me.compte;
  document.getElementById('carteProfil').innerHTML = `
    <div class="profil-avatar" style="width:64px;height:64px;font-size:1.5rem;color:var(--vert-fonce)">${esc((COMPTE.prenom[0]+COMPTE.nom[0]).toUpperCase())}</div>
    <div><h2 style="margin:0">${esc(me.label)}</h2>
      <p class="hint" style="margin:4px 0 0">${esc(COMPTE.email)} ${COMPTE.tel?'• '+esc(COMPTE.tel):''}
      <span class="chip chip-role">${COMPTE.role==='admin'?'Administrateur':COMPTE.role==='animateur'?'Animateur':'Parent'}</span></p></div>`;
  ['Prenom','Nom','Tel','Adresse'].forEach(k=>document.getElementById('c'+k).value = COMPTE[k.toLowerCase()]||'');
  cUrgence.value = COMPTE.contactUrgence||''; cCP.value = COMPTE.codePostal||''; cLocalite.value = COMPTE.localite||'';

  if(COMPTE.role==='parent'){
    const r = await api('enfants/mes'); ENFANTS = r.enfants;
    renderPaiements(); renderDocs();
  } else {
    document.getElementById('panel-paiements').innerHTML = '<div class="empty">Cette rubrique concerne uniquement les comptes parents.</div>';
    document.getElementById('panel-documents').innerHTML = '<div class="empty">Cette rubrique concerne uniquement les comptes parents.</div>';
  }
  await renderNotifs();

  const hash = location.hash.replace('#','');
  if(hash) document.querySelector(`.tab[data-tab="${hash}"]`)?.click();
})();

async function renderNotifs(){
  const { notifications } = await api('notifications/mes');
  const el = document.getElementById('notifs');
  el.innerHTML = notifications.length ? notifications.map(n=>`
    <div class="notif-item ${n.lue?'':'non-lue'}">
      <div class="ico-notif">${n.origine==='admin'?'⚙️':n.origine==='animateur'?'🧑‍🏫':'🔔'}</div>
      <div style="flex:1"><strong>${esc(n.titre)}</strong><p style="margin:4px 0">${esc(n.texte)}</p>
        <p class="hint">${fmtDateCourt(n.date.slice(0,10))} ${n.lue?'':'• <strong>non lue</strong>'}</p></div>
      ${n.lue?'':'<button class="btn btn-ghost btn-sm" onclick="marquerLu(\''+n.id+'\')">Marquer lu</button>'}
    </div>`).join('') : '<div class="empty"><span class="big">🔔</span>Aucune notification.</div>';
}
async function marquerLu(id){ await api('notifications/lire',{method:'POST',body:{id}}); await renderNotifs(); }
async function toutMarquerLu(){ await api('notifications/lire',{method:'POST',body:{all:true}}); await renderNotifs(); toast('Notifications marquées comme lues'); }

function renderPaiements(){
  const el = document.getElementById('paiements');
  if(!ENFANTS.length){ el.innerHTML='<div class="empty">Aucun enfant.</div>'; return; }
  el.innerHTML = ENFANTS.map(e=>`
    <section class="card">
      <h3 style="display:flex;align-items:center;gap:10px">
        <span class="enfant-avatar" style="width:36px;height:36px;font-size:.95rem;background:${couleurAvatar(e.sectionId)}">${esc(e.prenom[0].toUpperCase())}</span>
        Enfant : ${esc(e.prenom)} ${esc(e.nom)}</h3>
      ${(e.paiements||[]).map(p=>`
        <div class="paiement-ligne">
          <div><span class="pastille ${p.paye?'pastille-verte':'pastille-rouge'}"></span>
            <strong>${esc(p.label)}</strong> — ${p.montant} €</div>
          <span class="badge ${p.paye?'badge-ok':'badge-ko'}">${p.paye?'✔ Payé':'✘ Non payé'}</span>
        </div>`).join('') || '<div class="empty">Aucun paiement enregistré.</div>'}
    </section>`).join('');
}

function renderDocs(){
  const el = document.getElementById('docsEnfants');
  el.innerHTML = ENFANTS.map(e=>{
    const fs = e.documents?.ficheSante || {}; const ap = e.documents?.autorisation || {};
    return `<section class="card">
      <h3>${esc(e.prenom)} ${esc(e.nom)}</h3>
      <p class="hint">🩺 Fiche de santé : ${fs.updatedAt?('mise à jour le '+fmtDateCourt(fs.updatedAt.slice(0,10))):'<span class="badge badge-jaune">à compléter</span>'}</p>
      <p class="hint">✅ Autorisation parentale : ${ap.updatedAt?('mise à jour le '+fmtDateCourt(ap.updatedAt.slice(0,10))):'<span class="badge badge-jaune">à compléter</span>'}</p>
      <div class="btn-row"><a class="btn btn-primary btn-sm" href="enfant.html?id=${e.id}#documents">📄 Gérer les documents</a></div>
    </section>`;
  }).join('') || '<div class="empty">Aucun enfant.</div>';
}

async function sauverCompte(){
  try{
    const r = await api('compte/coordonnees',{method:'POST',body:{
      prenom:v('cPrenom'), nom:v('cNom'), tel:v('cTel'), adresse:v('cAdresse'),
      codePostal:v('cCP'), localite:v('cLocalite'), contactUrgence:v('cUrgence'),
    }});
    session.compte = r.compte; session.label = r.label;
    toast('Coordonnées mises à jour ✔');
  }catch(e){ toast(e.message,true); }
}
function v(id){ return document.getElementById(id).value.trim(); }
function deconnexion(){ api('auth/logout',{method:'POST'}).catch(()=>{}); session.clear(); location.href='index.html'; }
</script>
</body>
</html>
