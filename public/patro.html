<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C'est quoi le Patro ? — Patro Notre-Dame d'Ittre</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="hero hero-sm"><h1>❓ C'est quoi le Patro ?</h1><p>Fonctionnement, valeurs et organisation du mouvement</p></header>
<main class="container-sm">
  <p class="fil-ariane"><a href="index.html">🏠 Accueil</a> / C'est quoi le Patro ?</p>
  <section class="card card-accent">
    <div id="texte" style="white-space:pre-wrap;font-size:1.02rem"><div class="loader"></div></div>
  </section>
  <div class="btn-row"><a href="index.html" class="btn btn-ghost">← Retour à l'accueil</a></div>
</main>
<script src="assets/app.js"></script>
<script>
(async function(){
  await renderHeader(''); renderFooter();
  try{ const { contenu } = await api('contenu'); document.getElementById('texte').textContent = contenu.patroTexte; }
  catch(e){ document.getElementById('texte').innerHTML = '<div class="alert alert-err">Impossible de charger le texte.</div>'; }
})();
</script>
</body>
</html>
